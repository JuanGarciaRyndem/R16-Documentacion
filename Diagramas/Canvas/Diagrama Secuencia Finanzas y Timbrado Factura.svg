<svg width="100%" viewBox="0 0 680 930" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Diagrama de secuencia: Finanzas y Timbrado de Factura</title>
<desc>Finanzas guarda la factura en BD PQF2, luego llama a Timbrado. Timbrado registra un TimbradoLog en estado Pending, invoca al PAC Legacy para timbrar, actualiza el TimbradoLog con el resultado (Generado, Timbrado o Failed) y regresa el CFDI y XML a Finanzas. Si hubo error en el Timbrado, Finanzas guarda una Cola de Reintento en BD PQF2. Incluye el catalogo de estados IdStatus.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<style>
.box{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1}
.leader{stroke:#B4B2A9;stroke-width:0.5;stroke-dasharray:3 3}
.arr{stroke:#444441;stroke-width:1.5;fill:none}
.arr-red{stroke:#C0392B;stroke-width:1.5;fill:none}
.fragment{fill:#FCEBEB;stroke:#E24B4A;stroke-width:1}
.t{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;fill:#2C2C2A}
.th{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:500;fill:#2C2C2A}
.ts{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:400;fill:#444441}
.ts-red{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:400;fill:#791F1F}
.hl{fill:#E6F1FB;stroke:#378ADD;stroke-width:1}
.hlt{fill:#0C447C}
</style>

<rect class="box" x="40" y="40" width="100" height="56" rx="4"/>
<text class="th" x="90" y="58" text-anchor="middle">Finanzas</text>
<text class="ts" x="90" y="74" text-anchor="middle">Factura</text>
<text class="ts" x="90" y="88" text-anchor="middle">adelantada</text>

<rect class="box" x="165" y="40" width="100" height="56" rx="4"/>
<text class="th" x="215" y="72" text-anchor="middle">BD PQF2</text>

<rect class="box" x="290" y="40" width="100" height="56" rx="4"/>
<text class="th" x="340" y="72" text-anchor="middle">Timbrado</text>

<rect class="box" x="415" y="40" width="100" height="56" rx="4"/>
<text class="th" x="465" y="72" text-anchor="middle">BD Timbrado</text>

<rect class="box" x="540" y="40" width="100" height="56" rx="4"/>
<text class="th" x="590" y="72" text-anchor="middle">PAC Legacy</text>

<line class="leader" x1="90" y1="96" x2="90" y2="705"/>
<line class="leader" x1="215" y1="96" x2="215" y2="705"/>
<line class="leader" x1="340" y1="96" x2="340" y2="564"/>
<line class="leader" x1="465" y1="96" x2="465" y2="564"/>
<line class="leader" x1="590" y1="96" x2="590" y2="564"/>

<rect class="box" x="210" y="140" width="10" height="50"/>
<rect class="box" x="335" y="234" width="10" height="330"/>
<rect class="box" x="460" y="284" width="10" height="44"/>
<rect class="box" x="585" y="372" width="10" height="44"/>
<rect class="box" x="460" y="476" width="10" height="44"/>

<text class="ts" x="150" y="126" text-anchor="middle">Guarda fccFactura</text>
<line class="arr" x1="90" y1="140" x2="210" y2="140" marker-end="url(#arrow)"/>

<line class="arr" x1="210" y1="190" x2="90" y2="190" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text class="ts" x="212" y="220" text-anchor="middle">POST TimbrarFactura</text>
<line class="arr" x1="90" y1="234" x2="335" y2="234" marker-end="url(#arrow)"/>

<text class="ts" x="402" y="262" text-anchor="middle">Crea TimbradoLog</text>
<text class="ts" x="402" y="276" text-anchor="middle">(estado Pending)</text>
<line class="arr" x1="345" y1="284" x2="460" y2="284" marker-end="url(#arrow)"/>

<text class="ts" x="402" y="314" text-anchor="middle">Regresa GUID</text>
<line class="arr" x1="460" y1="328" x2="345" y2="328" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text class="ts" x="465" y="358" text-anchor="middle">Timbra documento</text>
<line class="arr" x1="345" y1="372" x2="585" y2="372" marker-end="url(#arrow)"/>

<text class="ts" x="465" y="402" text-anchor="middle">Respuesta PAC</text>
<line class="arr" x1="585" y1="416" x2="345" y2="416" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text class="ts" x="402" y="444" text-anchor="middle">Actualiza TimbradoLog</text>
<text class="ts" x="402" y="458" text-anchor="middle">(Generado/Timbrado/Failed)</text>
<line class="arr" x1="345" y1="476" x2="460" y2="476" marker-end="url(#arrow)"/>

<line class="arr" x1="460" y1="520" x2="345" y2="520" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<text class="ts" x="212" y="550" text-anchor="middle">Regresa CFDI + XML</text>
<line class="arr" x1="335" y1="564" x2="90" y2="564" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<rect class="fragment" x="30" y="590" width="250" height="115" rx="2"/>
<text class="ts-red" x="38" y="606">opt — Si hay error en el Timbrado</text>
<text class="ts-red" x="153" y="630" text-anchor="middle">Guarda Cola de</text>
<text class="ts-red" x="153" y="644" text-anchor="middle">Reintento en BD</text>
<line class="arr-red" x1="90" y1="656" x2="215" y2="656" marker-end="url(#arrow)"/>
<line class="arr-red" x1="215" y1="690" x2="90" y2="690" marker-end="url(#arrow)"/>

<text class="th" x="40" y="760">Catálogo IdStatus (TimbradoLog)</text>
<text class="th" x="40" y="782">Estado</text>
<text class="th" x="150" y="782">Descripción</text>
<text class="th" x="560" y="782">Clave</text>
<line x1="40" y1="790" x2="620" y2="790" stroke="#D3D1C7" stroke-width="1"/>

<text class="ts" x="40" y="808">Failed</text>
<text class="ts" x="150" y="808">Error técnico o funcional durante la generación</text>
<text class="ts" x="560" y="808">failed</text>
<line x1="40" y1="816" x2="620" y2="816" stroke="#D3D1C7" stroke-width="1"/>

<text class="ts" x="40" y="832">Pending</text>
<text class="ts" x="150" y="832">Documento solicitado, aún no procesado</text>
<text class="ts" x="560" y="832">pending</text>
<line x1="40" y1="840" x2="620" y2="840" stroke="#D3D1C7" stroke-width="1"/>

<text class="ts" x="40" y="856">Generated</text>
<text class="ts" x="150" y="856">Documento generado exitosamente</text>
<text class="ts" x="560" y="856">generated</text>
<line x1="40" y1="864" x2="620" y2="864" stroke="#D3D1C7" stroke-width="1"/>

<rect class="hl" x="40" y="866" width="580" height="24"/>
<text class="ts hlt" x="40" y="882" fill="#0C447C">Processing</text>
<text class="ts hlt" x="150" y="882" fill="#0C447C">Documento en proceso de generación (estado intermedio)</text>
<text class="ts hlt" x="560" y="882" fill="#0C447C">processing</text>
</svg>
