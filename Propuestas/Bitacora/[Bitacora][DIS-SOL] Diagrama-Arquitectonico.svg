<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 590" width="920" height="590" style="font-family:'Segoe UI',Arial,sans-serif">

  <!-- Background -->
  <rect width="920" height="590" fill="#eef1f7"/>

  <!-- Title -->
  <text x="460" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Diagrama arquitectónico simplificado — ProquifaDotNet.Bitacora</text>

  <!-- ─────────────── COLUMN HEADERS ─────────────── -->
  <text x="100" y="44" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0d9488" letter-spacing="1">APLICATIVOS PRODUCTORES</text>
  <text x="458" y="44" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0d9488" letter-spacing="1">APLICATIVO DE BITÁCORA</text>
  <text x="810" y="44" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#0d9488" letter-spacing="1">RECURSOS EXTERNOS</text>

  <!-- ─────────────── PRODUCER BOXES ─────────────── -->
  <!-- ProquifaDotNet (.NET Fx 4.8) -->
  <rect x="10" y="52" width="178" height="52" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="99" y="72" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">ProquifaDotNet</text>
  <text x="99" y="87" text-anchor="middle" font-size="9.5" fill="#3b82f6">.NET Fx 4.8</text>

  <!-- ProquifaDotNet.Finanzas (.NET 10) -->
  <rect x="10" y="112" width="178" height="52" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="99" y="132" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">ProquifaDotNet.Finanzas</text>
  <text x="99" y="147" text-anchor="middle" font-size="9.5" fill="#3b82f6">.NET 10</text>

  <!-- Promsy -->
  <rect x="10" y="172" width="178" height="52" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="99" y="192" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">Promsy</text>
  <text x="99" y="207" text-anchor="middle" font-size="9.5" fill="#3b82f6">Compras</text>

  <!-- VentaDigital -->
  <rect x="10" y="232" width="178" height="52" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="99" y="252" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">VentaDigital</text>
  <text x="99" y="267" text-anchor="middle" font-size="9.5" fill="#3b82f6">Canal digital</text>

  <!-- DocumentBuilder -->
  <rect x="10" y="292" width="178" height="52" rx="7" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.2"/>
  <text x="99" y="312" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e40af">DocumentBuilder</text>
  <text x="99" y="327" text-anchor="middle" font-size="9.5" fill="#3b82f6">Generación de documentos</text>

  <!-- Publisher NuGet library -->
  <rect x="10" y="366" width="178" height="68" rx="7" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="99" y="385" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6d28d9">Proquifa.Bitacora.Publisher</text>
  <text x="99" y="399" text-anchor="middle" font-size="9" fill="#7c3aed">NuGet · net48;netstandard2.0</text>
  <text x="99" y="413" text-anchor="middle" font-size="9" fill="#7c3aed">fire&amp;forget · Trace Context</text>
  <text x="99" y="426" text-anchor="middle" font-size="9" fill="#7c3aed">IBitacoraEventBuffer</text>

  <!-- Arrows: Producers → Publisher -->
  <line x1="99" y1="344" x2="99" y2="364" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#smah)"/>

  <!-- Arrows: Each producer → main (horizontal) -->
  <defs>
    <marker id="smah" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="#6b7280"/>
    </marker>
    <marker id="smahb" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto">
      <polygon points="0 0,7 3,0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Publisher → Main: AMQP arrow -->
  <line x1="188" y1="400" x2="208" y2="400" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#smah)"/>
  <text x="198" y="396" text-anchor="middle" font-size="8" fill="#7c3aed">AMQP</text>

  <!-- Thin arrows from each producer to center (at their y-center) -->
  <line x1="188" y1="78" x2="208" y2="78" stroke="#94a3b8" stroke-width="1" marker-end="url(#smahb)"/>
  <line x1="188" y1="138" x2="208" y2="138" stroke="#94a3b8" stroke-width="1" marker-end="url(#smahb)"/>
  <line x1="188" y1="198" x2="208" y2="198" stroke="#94a3b8" stroke-width="1" marker-end="url(#smahb)"/>
  <line x1="188" y1="258" x2="208" y2="258" stroke="#94a3b8" stroke-width="1" marker-end="url(#smahb)"/>
  <line x1="188" y1="318" x2="208" y2="318" stroke="#94a3b8" stroke-width="1" marker-end="url(#smahb)"/>

  <!-- ─────────────── MAIN SYSTEM BOX ─────────────── -->
  <rect x="205" y="52" width="506" height="516" rx="12" fill="white" stroke="#d1fae5" stroke-width="2"/>
  <text x="458" y="74" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#059669" letter-spacing="0.8">CLEAN ARCHITECTURE</text>
  <text x="458" y="90" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e293b">ProquifaDotNet.Bitacora</text>
  <text x="458" y="105" text-anchor="middle" font-size="9" fill="#64748b">.NET 10 Microservice</text>

  <!-- API Layer (green) -->
  <rect x="218" y="115" width="480" height="98" rx="7" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <rect x="218" y="115" width="82" height="98" rx="7" fill="#bbf7d0"/>
  <text x="259" y="160" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534" transform="rotate(-90, 259, 160)" dy="4">API</text>
