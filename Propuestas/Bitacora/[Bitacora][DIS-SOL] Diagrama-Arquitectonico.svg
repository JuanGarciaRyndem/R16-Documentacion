  <text x="320" y="155" font-size="9.5" fill="#15803d">GET /api/v1/bitacoras · filtros · paginación</text>
  <text x="320" y="168" font-size="9.5" fill="#15803d">Bearer token · rol Auditor (RT-B14)</text>
  <text x="320" y="183" font-size="9.5" fill="#15803d">Health Checks: /health/live · /health/ready</text>

  <!-- Application Layer (blue) -->
  <rect x="218" y="221" width="480" height="90" rx="7" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <rect x="218" y="221" width="82" height="90" rx="7" fill="#bfdbfe"/>
  <text x="259" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a" transform="rotate(-90, 259, 268)" dy="4">Application</text>
  <text x="320" y="244" font-size="10.5" font-weight="bold" fill="#1d4ed8">CQRS — Commands / Queries</text>
  <text x="320" y="259" font-size="9.5" fill="#2563eb">BitacorasQueryHandler · GetBitacorasQuery</text>
  <text x="320" y="274" font-size="9.5" fill="#2563eb">DTOs: BitacoraQueryResponse · QueryInfo</text>
  <text x="320" y="289" font-size="9.5" fill="#2563eb">IBitacoraDiffBuilder (RT-B19)</text>

  <!-- Domain Layer (yellow) -->
  <rect x="218" y="319" width="480" height="90" rx="7" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
  <rect x="218" y="319" width="82" height="90" rx="7" fill="#fef08a"/>
  <text x="259" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#854d0e" transform="rotate(-90, 259, 366)" dy="4">Domain</text>
  <text x="320" y="342" font-size="10.5" font-weight="bold" fill="#92400e">Entidades y contratos de dominio</text>
  <text x="320" y="357" font-size="9.5" fill="#a16207">BitacoraEventoV1 · BitacoraDocument</text>
  <text x="320" y="372" font-size="9.5" fill="#a16207">BitacoraOperationEnum: Create / Update / Delete</text>
  <text x="320" y="387" font-size="9.5" fill="#a16207">IBitacoraRepository · IBitacoraEventBuffer</text>

  <!-- Infrastructure Layer (purple) -->
  <rect x="218" y="417" width="480" height="138" rx="7" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
  <rect x="218" y="417" width="82" height="138" rx="7" fill="#e9d5ff"/>
  <text x="259" y="490" text-anchor="middle" font-size="11" font-weight="bold" fill="#581c87" transform="rotate(-90, 259, 490)" dy="4">Infrastructure</text>
  <text x="320" y="440" font-size="10.5" font-weight="bold" fill="#6b21a8">BitacorasConsumerWorker (BackgroundService)</text>
  <text x="320" y="455" font-size="9.5" fill="#7e22ce">Consume Bitacoras.Eventos · valida SchemaVersion</text>
  <text x="320" y="470" font-size="9.5" fill="#7e22ce">Idempotencia EventoId · Retry con TTL escalonado</text>
  <text x="320" y="485" font-size="9.5" fill="#7e22ce">W3C Trace Context propagation (RT-B09)</text>
  <text x="320" y="500" font-size="9.5" fill="#7e22ce">MongoDB.Driver · RabbitMQ.Client</text>
  <text x="320" y="515" font-size="9.5" fill="#7e22ce">IdentityServer (Bearer) · Serilog (logs estructurados)</text>
  <text x="320" y="530" font-size="9.5" fill="#7e22ce">EF Core Scaffold — tablas ProquifaDotNet (solo lectura)</text>

  <!-- ─────────────── RESOURCE BOXES ─────────────── -->

  <!-- Arrow: Main → Resources (generic) -->
  <line x1="711" y1="300" x2="726" y2="300" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#smahb)"/>

  <!-- MongoDB -->
  <rect x="728" y="52" width="182" height="105" rx="8" fill="#fdf2f8" stroke="#e879f9" stroke-width="1.5"/>
  <text x="819" y="76" text-anchor="middle" font-size="13" fill="#a21caf">🍃</text>
  <text x="819" y="94" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#701a75">MongoDB</text>
  <text x="819" y="109" text-anchor="middle" font-size="9.5" fill="#a21caf">ProquifaBitacoras</text>
  <text x="819" y="122" text-anchor="middle" font-size="9.5" fill="#a21caf">colección bitacoras</text>
  <text x="819" y="135" text-anchor="middle" font-size="9" fill="#c026d3">Append-only · Índice único EventoId</text>

  <!-- RabbitMQ -->
  <rect x="728" y="165" width="182" height="105" rx="8" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="819" y="188" text-anchor="middle" font-size="13" fill="#d97706">🐇</text>
  <text x="819" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">RabbitMQ</text>
  <text x="819" y="221" text-anchor="middle" font-size="9.5" fill="#b45309">proquifa.bitacoras.eventos</text>
  <text x="819" y="236" text-anchor="middle" font-size="9.5" fill="#b45309">Eventos · Retry (TTL+DLX)</text>
  <text x="819" y="251" text-anchor="middle" font-size="9" fill="#d97706">Bitacoras.Eventos.Errores</text>

  <!-- IdentityServer -->
  <rect x="728" y="278" width="182" height="88" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/>
  <text x="819" y="300" text-anchor="middle" font-size="13" fill="#0369a1">🔐</text>
  <text x="819" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0c4a6e">IdentityServer</text>
  <text x="819" y="333" text-anchor="middle" font-size="9.5" fill="#0369a1">Bearer token</text>
  <text x="819" y="347" text-anchor="middle" font-size="9.5" fill="#0369a1">claim rol Auditor</text>

  <!-- Serilog -->
  <rect x="728" y="374" width="182" height="88" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="819" y="396" text-anchor="middle" font-size="13" fill="#c2410c">📋</text>
  <text x="819" y="414" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#7c2d12">Serilog</text>
  <text x="819" y="429" text-anchor="middle" font-size="9.5" fill="#c2410c">Logs estructurados</text>
  <text x="819" y="444" text-anchor="middle" font-size="9.5" fill="#c2410c">TraceId / SpanId (RT-B12/B13)</text>

  <!-- Arrows: Main → each resource -->
  <line x1="711" y1="102" x2="726" y2="102" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#smahb)"/>
  <line x1="711" y1="215" x2="726" y2="215" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#smahb)"/>
  <line x1="711" y1="320" x2="726" y2="320" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#smahb)"/>
  <line x1="711" y1="418" x2="726" y2="418" stroke="#94a3b8" stroke-width="1.2" marker-end="url(#smahb)"/>

</svg>
